<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="X-UA-Compatible" content="IE=edge">
<title>Signage Player</title>
<style>
  html, body { margin: 0; padding: 0; width: 100%; height: 100%; background: #000; overflow: hidden; cursor: none; }
  body { font-family: Arial, Helvetica, sans-serif; color: #fff; }
  #stage { position: absolute; left: 0; top: 0; width: 100%; height: 100%; overflow: hidden; }
  .zone { position: absolute; overflow: hidden; }
  .layer { position: absolute; left: 0; top: 0; width: 100%; height: 100%; opacity: 0;
           -webkit-transition: opacity 0.6s ease; transition: opacity 0.6s ease; }
  .layer.show { opacity: 1; }
  .fill { position: absolute; left: 0; top: 0; width: 100%; height: 100%; }
  .imgfill { background-repeat: no-repeat; background-position: center center; background-size: contain; }
  .imgfill.cover { background-size: cover; }
  .zone video { width: 100%; height: 100%; background: #000; }
  .zone iframe { width: 100%; height: 100%; border: 0; background: #fff; }
  .msg { position: absolute; left: 0; top: 0; width: 100%; height: 100%; display: -webkit-box; display: -webkit-flex; display: flex;
         -webkit-box-pack: center; -webkit-justify-content: center; justify-content: center;
         -webkit-box-align: center; -webkit-align-items: center; align-items: center; text-align: center; color: #9ca3af; font-size: 3vh; }
  .ticker { white-space: nowrap; display: -webkit-box; display: -webkit-flex; display: flex;
            -webkit-box-align: center; -webkit-align-items: center; align-items: center; }
  .ticker span { position: absolute; white-space: nowrap; left: 0; top: 50%; -webkit-transform: translateY(-50%); transform: translateY(-50%); }
  .clock { display: -webkit-box; display: -webkit-flex; display: flex; -webkit-box-orient: vertical; -webkit-flex-direction: column; flex-direction: column;
           -webkit-box-pack: center; -webkit-justify-content: center; justify-content: center;
           -webkit-box-align: center; -webkit-align-items: center; align-items: center; text-align: center; line-height: 1.1; }
  .clock .date { opacity: 0.75; }
  #pair { position: absolute; left: 0; top: 0; width: 100%; height: 100%; background: #0f172a; display: none; text-align: center; }
  #pair .inner { position: absolute; left: 0; right: 0; top: 50%; -webkit-transform: translateY(-50%); transform: translateY(-50%); }
  #pair h1 { font-size: 4vh; font-weight: normal; color: #cbd5e1; margin: 0 0 2vh; }
  #pair .code { font-size: 18vh; font-weight: bold; letter-spacing: 0.15em; color: #fff; margin: 0; font-family: "Courier New", monospace; }
  #pair p { font-size: 3vh; color: #94a3b8; margin: 3vh 0 0; }
  #pair small { display: block; font-size: 2vh; color: #475569; margin-top: 4vh; }
  #status { position: absolute; right: 1vh; bottom: 1vh; width: 1.2vh; height: 1.2vh; border-radius: 50%; background: #22c55e; opacity: 0.35; }
  #status.off { background: #ef4444; opacity: 0.9; }
  #err { position: absolute; left: 0; bottom: 0; width: 100%; background: rgba(127,29,29,0.9); color: #fff; font-size: 2vh; padding: 1vh 2vh; display: none; box-sizing: border-box; }
</style>
</head>
<body>
  <div id="stage"></div>
  <div id="pair">
    <div class="inner">
      <h1>Pair this screen</h1>
      <p class="code" id="code">------</p>
      <p>Open the dashboard and enter this code under <b>Screens &rarr; Pair a screen</b>.</p>
      <small id="pairinfo"></small>
    </div>
  </div>
  <div id="status"></div>
  <div id="err"></div>
  <script src="/player.js"></script>
</body>
</html>
